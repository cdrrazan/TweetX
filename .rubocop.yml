plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'data/**/*'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Metrics/MethodLength:
  Max: 30

Metrics/AbcSize:
  Max: 30

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 10

Layout/LineLength:
  Max: 140

# Scheduler is documented with RDoc-style ## blocks, which this cop does not
# recognise as a class-level comment.
Style/Documentation:
  Enabled: false

# The CLI talks to people through stdout; puts is the interface, not a leftover.
Style/StderrPuts:
  Enabled: false

# Scheduler is one cohesive object: selection, formatting, CSV IO and the API
# client. Splitting it is a design decision, not a lint fix.
Metrics/ClassLength:
  Max: 200

# The specs freeze Scheduler's clock by stubbing my_timezone on the subject,
# and count calls to select_tweet to prove run only picks once. Both are
# deliberate: the behaviour being tested is time-dependent and call-count
# dependent, which is exactly what this cop cannot see.
RSpec/SubjectStub:
  Enabled: false
